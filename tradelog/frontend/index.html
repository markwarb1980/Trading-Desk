<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #020617;
      --surface: #0f172a;
      --surface2: #1e293b;
      --border: #1e293b;
      --border2: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green: #10b981;
      --green-dim: #064e3b;
      --red: #f43f5e;
      --red-dim: #4c0519;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --font: 'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 8px;
      z-index: 100;
    }

    .navbar-brand {
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.5px;
      margin-right: 24px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2px;
      flex: 1;
    }

    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.15s;
      border: none;
      background: none;
      font-family: var(--font);
    }

    .nav-link:hover { background: var(--surface2); color: var(--text); }
    .nav-link.active { background: var(--surface2); color: var(--text); }

    .navbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* Buttons */
    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--green); color: #000; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
    .btn-secondary:hover { background: var(--border2); }
    .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-dim); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    /* Layout */
    .main { margin-top: 52px; padding: 24px; max-width: 1400px; margin-left: auto; margin-right: auto; }

    .section { display: none; }
    .section.active { display: block; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Metric cards grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }

    .metric-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .metric-value.positive { color: var(--green); }
    .metric-value.negative { color: var(--red); }

    /* Charts grid */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .chart-container {
      position: relative;
      height: 240px;
    }

    /* Tables */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead th {
      padding: 10px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    thead th:hover { color: var(--text-muted); }
    thead th.sorted { color: var(--text); }
    thead th.sorted::after { content: ' ▼'; font-size: 9px; }
    thead th.sorted.asc::after { content: ' ▲'; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    tbody tr:hover { background: var(--surface2); }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 10px 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    td.positive { color: var(--green); }
    td.negative { color: var(--red); }
    td.text { color: var(--text); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-long { background: var(--green-dim); color: var(--green); }
    .badge-short { background: var(--red-dim); color: var(--red); }
    .badge-neutral { background: var(--surface2); color: var(--text-muted); }
    .badge-tag { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border2); margin: 1px; font-size: 10px; padding: 2px 6px; }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-bar input,
    .filter-bar select {
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      transition: border 0.15s;
    }

    .filter-bar input:focus,
    .filter-bar select:focus { border-color: var(--green); }

    .filter-bar select option { background: var(--surface); }

    /* Form inputs */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      transition: border 0.15s;
    }

    .form-control:focus { border-color: var(--green); }
    .form-control option { background: var(--surface); }

    textarea.form-control { resize: vertical; min-height: 80px; }

    /* Grid helpers */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      display: none;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
    }

    .modal-close:hover { color: var(--text); }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Table footer */
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      color: var(--text-dim);
      font-size: 11px;
    }

    /* Calendar */
    .calendar-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .calendar-nav {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
    }

    .calendar-nav:hover { background: var(--border2); }

    .calendar-title { font-size: 16px; font-weight: 700; color: var(--text); min-width: 160px; text-align: center; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 20px;
    }

    .cal-day-header {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      padding: 8px 4px;
    }

    .cal-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      min-height: 70px;
      position: relative;
    }

    .cal-day.empty { background: transparent; border-color: transparent; }

    .cal-day-num {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .cal-day-pnl {
      font-size: 12px;
      font-weight: 700;
    }

    .cal-day-count {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .cal-day.has-profit { border-color: #064e3b; background: rgba(16,185,129,0.06); }
    .cal-day.has-loss { border-color: #4c0519; background: rgba(244,63,94,0.06); }
    .cal-day.today { border-color: var(--blue) !important; }

    /* Calendar summary */
    .cal-summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .cal-summary-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .cal-summary-label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
    .cal-summary-value { font-size: 16px; font-weight: 700; }

    /* Journal */
    .mood-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mood-btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid var(--border2);
      background: var(--surface2);
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mood-btn span { font-size: 10px; font-weight: 600; color: var(--text-dim); font-family: var(--font); }

    .mood-btn:hover, .mood-btn.selected { border-color: var(--green); background: var(--green-dim); }
    .mood-btn.selected span { color: var(--green); }

    .mood-history { display: flex; gap: 6px; margin-top: 20px; }

    .mood-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1px solid var(--border2);
    }

    /* Tooltip */
    [title] { cursor: help; }

    /* Responsive */
    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 13px;
    }

    .loading::before {
      content: '';
      width: 16px;
      height: 16px;
      border: 2px solid var(--border2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
    }

    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a class="navbar-brand" href="#">TradeLog</a>
  <div class="nav-links">
    <button class="nav-link active" data-section="dashboard">Dashboard</button>
    <button class="nav-link" data-section="trades">Trades</button>
    <button class="nav-link" data-section="calendar">Calendar</button>
    <button class="nav-link" data-section="reports">Reports</button>
    <button class="nav-link" data-section="journal">Journal</button>
  </div>
  <div class="navbar-right">
    <button class="btn btn-secondary btn-sm" id="importBtn">Import CSV</button>
  </div>
</nav>

<!-- Main content -->
<div class="main" style="margin-top: 76px;">
  <div id="section-dashboard" class="section active"></div>
  <div id="section-trades" class="section"></div>
  <div id="section-calendar" class="section"></div>
  <div id="section-reports" class="section"></div>
  <div id="section-journal" class="section"></div>
</div>

<!-- Import CSV Modal -->
<div class="modal-overlay" id="importModal">
  <div class="modal" style="max-width: 480px;">
    <div class="modal-header">
      <div class="modal-title">Import Trades from CSV</div>
      <button class="modal-close" id="importModalClose">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">CSV File</label>
      <input type="file" accept=".csv" id="importFile" class="form-control" />
    </div>
    <div class="form-group">
      <label class="form-label">Format</label>
      <select id="importFormat" class="form-control">
        <option value="auto">Auto-detect</option>
        <option value="mt4">MetaTrader 4/5</option>
        <option value="ibkr">Interactive Brokers</option>
        <option value="generic">Generic CSV</option>
      </select>
    </div>
    <div id="importResult" style="display:none; margin-top:12px; padding:12px; border-radius:6px; font-size:12px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="importCancel">Cancel</button>
      <button class="btn btn-primary" id="importSubmit">Import</button>
    </div>
  </div>
</div>

<!-- Trade Edit Modal -->
<div class="modal-overlay" id="tradeModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="tradeModalTitle">Add Trade</div>
      <button class="modal-close" id="tradeModalClose">&times;</button>
    </div>
    <div id="tradeModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="tradeDeleteBtn" style="display:none; margin-right:auto;">Delete</button>
      <button class="btn btn-secondary" id="tradeModalCancel">Cancel</button>
      <button class="btn btn-primary" id="tradeModalSave">Save</button>
    </div>
  </div>
</div>

<script src="/static/dashboard.js"></script>
<script src="/static/trade_log.js"></script>
<script src="/static/calendar.js"></script>
<script src="/static/reports.js"></script>
<script src="/static/journal.js"></script>

<script>
// Nav routing
const sections = ['dashboard', 'trades', 'calendar', 'reports', 'journal'];
const loaders = {
  dashboard: () => loadDashboard(),
  trades: () => loadTrades(),
  calendar: () => loadCalendar(),
  reports: () => loadReports(),
  journal: () => loadJournal(),
};

let currentSection = 'dashboard';

function showSection(name) {
  sections.forEach(s => {
    document.getElementById('section-' + s).classList.toggle('active', s === name);
    document.querySelector(`.nav-link[data-section="${s}"]`).classList.toggle('active', s === name);
  });
  currentSection = name;
  if (loaders[name]) loaders[name]();
}

document.querySelectorAll('.nav-link[data-section]').forEach(btn => {
  btn.addEventListener('click', () => showSection(btn.dataset.section));
});

// Import modal
const importModal = document.getElementById('importModal');
document.getElementById('importBtn').addEventListener('click', () => importModal.classList.add('open'));
document.getElementById('importModalClose').addEventListener('click', () => importModal.classList.remove('open'));
document.getElementById('importCancel').addEventListener('click', () => importModal.classList.remove('open'));

document.getElementById('importSubmit').addEventListener('click', async () => {
  const file = document.getElementById('importFile').files[0];
  if (!file) { alert('Please select a CSV file'); return; }
  const format = document.getElementById('importFormat').value;
  const fd = new FormData();
  fd.append('file', file);
  const btn = document.getElementById('importSubmit');
  btn.disabled = true;
  btn.textContent = 'Importing...';
  try {
    const res = await fetch(`/api/import/csv?format=${format}`, { method: 'POST', body: fd });
    const data = await res.json();
    const div = document.getElementById('importResult');
    div.style.display = 'block';
    if (res.ok) {
      div.style.background = 'rgba(16,185,129,0.1)';
      div.style.border = '1px solid #064e3b';
      div.style.color = '#10b981';
      div.innerHTML = `Imported: <strong>${data.imported}</strong> trades. Skipped: ${data.skipped}.` +
        (data.errors.length ? `<br>Errors: ${data.errors.slice(0,5).join(', ')}` : '');
    } else {
      div.style.background = 'rgba(244,63,94,0.1)';
      div.style.border = '1px solid #4c0519';
      div.style.color = '#f43f5e';
      div.textContent = data.detail || 'Import failed';
    }
  } catch(e) {
    alert('Import failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Import';
  }
});

// On init
loadDashboard();
</script>
</body>
</html>
